name: Render blog posts

on:
  push:
    branches: [main]
    paths:
      - 'blog*.qmd'
      - '_blog-style.css'
      - '_blog-format.yml'
      - '.github/workflows/render-blogs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render every blog*.qmd
        run: |
          shopt -s nullglob
          for f in blog*.qmd; do
            echo "::group::Rendering $f"
            # --metadata-file applies _blog-format.yml on top of the qmd's
            # own front-matter, so blog posts pick up the site styling
            # without affecting any other qmd in the project.
            quarto render "$f" --metadata-file _blog-format.yml
            echo "::endgroup::"
          done

      - name: Commit rendered HTML + style assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the rendered HTML, any _files dir Quarto created, AND
          # the CSS that Quarto copied alongside (so Pages serves it).
          find docs -maxdepth 3 \
            \( -name 'blog*.html' -o -name 'blog*_files' -o -name '_blog-style.css' \) \
            -print 2>/dev/null | while read f; do
            git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "Auto-render blog posts [skip ci]"
            git push
          else
            echo "Nothing staged — nothing to commit."
          fi
